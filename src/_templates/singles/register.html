{{ extends "_base.html" }}

{{ block TITLE }}
µLedger: Register
{{ endblock }}

{{ block HEAD }}
<link rel="stylesheet" href="/assets/styles/single.scss" />
{{ endblock }}

{{ block BODY }}
<div id="content" hx-ext="response-targets">
    <div id="form-status"></div>

    <form hx-post="/api/v1/user/register" hx-target-error="#register-status">
        <label for="display_name">What should we call you?</label>
        <input type="text" name="display_name" placeholder="your name..." required />

        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." required />

        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." required />

        <input type="submit" value="Register" />
    </form>
</div>
{{ endblock }}

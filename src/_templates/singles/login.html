{{ extends "singles/_single.html" }}

{{ block TITLE }}
µLedger: Login
{{ endblock }}

{{ block CONTENT }}
<div class="flex-col flex-naxis-center w-dialog">
    <span id="form-status"></span>

    <form class="flex-col w-100" hx-post="/api/v1/user/login" hx-target-error="#form-status">
        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." required />

        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." required />

        <input type="submit" value="Login" />
    </form>

    <span>
        If you don't have an account, <a href="/register">please register</a>.
    </span>
</div>
{{ endblock }}

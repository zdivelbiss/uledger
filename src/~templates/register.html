{{ extends "base.html" }}

{{ block TITLE }}
µLedger: Login
{{ endblock }}

{{ block BODY }}
<div id="login-form" hx-ext="response-targets">
    <div id="login-form-status"></div>

    <form class="form" hx-post="/api/v1/user/register" hx-target-error="#login-form-status" hx-swap="innerHTML">
        <label for="display_name">What should we call you?</label>
        <input type="text" name="display_name" placeholder="your name..." />

        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." />

        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." />

        <input type="submit" value="Register" />
    </form>
</div>
{{ endblock }}

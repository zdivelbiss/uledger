{{ extends "~base.html" }}

{{ block TITLE }}
µLedger: Register
{{ endblock }}

{{ block HEAD }}
<link rel="stylesheet" href="/styles/login.scss" />
{{ endblock }}

{{ block CONTENT }}
<div class="login-area" hx-ext="response-targets">
    <div id="form-status"></div>

    <form class="form" hx-post="/api/v1/user/register" hx-target-error="#register-status">
        <label>
            What should we call you?<br />
            <input type="text" name="display_name" placeholder="your name..." required />
        </label>


        <label>
            Your Email Address<br />
            <input type="text" name="email_address" placeholder="email address..." required />
        </label>

        <label>
            Your Password<br />
            <input type="password" name="password" placeholder="password..." required />
        </label>

        <input type="submit" value="Register" />
    </form>
</div>
{{ endblock }}

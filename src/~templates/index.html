{{ extends "base.html" }}

{{ block TITLE }}
µLedger: Home
{{ endblock }}

{{ block BODY }}
<p>
    Welcome, {:+display_name:}!
</p>

<h3>Your Accounts</h3>

<div hx-trigger="load once" hx-get="/api/v1/ledger/accounts">
</div>

<div id="create-account-area" hx-ext="response-targets">
    <div id="create-account-status"></div>

    <form class="form" hx-post="/api/v1/user/register" hx-target-error="#create-account-status" hx-swap="innerHTML">
        <label>
            Account Name<br />
            <input type="text" name="name" placeholder="account name..." required />
        </label>

        <label>
            Account Description<br />
            <input type="" name="description" placeholder="account descrition..." />
        </label>

        <input type="submit" value="Create Account" />
    </form>
</div>
{{ endblock }}

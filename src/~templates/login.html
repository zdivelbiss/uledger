{{ extends "~base.html" }}

{{ block TITLE }}
µLedger: Login
{{ endblock }}

{{ block HEAD }}
<link rel="stylesheet" href="/styles/login.scss" />
{{ endblock }}

{{ block CONTENT }}
<div class="login-area" hx-ext="response-targets">
    <div id="form-status"></div>

    <form hx-post="/api/v1/user/login" hx-target-error="#form-status">
        <label>
            Your Email Address<br />
            <input type="text" name="email_address" placeholder="email address..." required />
        </label>

        <label>
            Your Password<br />
            <input type="password" name="password" placeholder="password..." required />
        </label>

        <input type="submit" value="Login" />
    </form>

    <span>If you don't have an account, <a href="/register">please register</a>.</span>
</div>
{{ endblock }}

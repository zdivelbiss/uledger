{{ extends "base.html" }}

{{ block TITLE }}
µLedger: Login
{{ endblock }}

{{ block BODY }}
<div id="login-form" hx-ext="response-targets">
    <div id="login-form-status"></div>

    <form class="login-form" hx-post="/api/v1/user/login" hx-target="#login-form-status"
        hx-target-error="#login-form-status" hx-swap="innerHTML">
        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." />

        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." />

        <input type="submit" value="Login" />
    </form>

    <span>If you don't have an account, <a href="/register">please register</a>.</span>
</div>
{{ endblock }}

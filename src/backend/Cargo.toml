[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "*"
anyhow = "*"
tracing = "*"
tracing-subscriber = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["full"] }
chrono = { version = "*", features = ["serde"] }
postgrest = "*"
figment = { version = "*", features = ["env"] }
uuid = { version = "*", features = ["serde", "v4", "v7"] }
sqlx = { version = "*", features = [
    "migrate",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
] }

[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "*"
anyhow = "*"
thiserror = "*"

tokio = { version = "*", features = ["full"] }
tracing = "*"
tracing-subscriber = "*"

figment = { version = "*", features = ["env"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
regex = "*"

chrono = { version = "*", features = ["serde"] }
uuid = { version = "*", features = ["serde", "v4", "v7"] }
redis = { version = "*", features = ["aio", "ahash", "tokio-comp", "uuid"] }
sqlx = { version = "*", features = [
    "migrate",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
] }

rustls = { version = "*", default-features = false, features = [
    "ring",
    "logging",
] }

axum = { version = "*", features = ["tracing"] }
tower-http = { version = "*", features = [
    "set-header",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "decompression-br",
    "decompression-gzip",
    "decompression-zstd",
] }

reqwest = { version = "*", default-features = false, features = [
    "http2",
    "charset",
    "gzip",
    "json",
    "rustls-tls",
] }

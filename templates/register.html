{% extends "base.html" %}

{% block head %}
<title>µLedger: Login</title>
{% endblock %}

{% block body %}
{% if is_authenticated %}
<p>
    You are already logged in.
    You will be redirected shortly.

    TODO
</p>
{% else %}
<div id="login-form" hx-ext="response-targets">
    <div id="login-form-status"></div>

    <form class="form"
        hx-post="/api/v1/auth/login"
        hx-target="#login-form-status"
        hx-target-error="#login-form-status"
        hx-swap="innerHTML"
    >
        <label for="display_name">What should we call you?</label>
        <input type="text" name="display_name" placeholder="your preferred name..." />

        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." />
        
        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." />

        <input type="submit" value="Login" />
    </form>
</div>
{% endif %}
{% endblock %}

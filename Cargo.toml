[package]
name = "uledger"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
thiserror = "2.0"

tokio = { version = "1.47", default-features = false, features = [
    "rt-multi-thread",
] }
tracing = "0.1"
tracing-subscriber = "0.3"

figment = { version = "0.10", features = ["env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
argon2 = { version = "0.5", features = ["std", "simple"] }
strum = { version = "0.27", features = ["derive"] }
rand = "0.9"
base64 = "0.22"
regex = "1.11"
hex = "0.4"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
sqlx = { version = "0.8", features = [
    "migrate",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "derive",
] }


axum = { version = "0.8", default-features = false, features = [
    "tracing",
    "macros",
    "http1",
    "http2",
    "json",
    "tokio",
    "form",
    "query",
] }
askama = { version = "0.14", default-features = false, features = [
    "derive",
    "std",
    "urlencode",
    "config",
] }
askama_web = { version = "0.14", default-features = false, features = [
    "tracing-0.1",
    "axum-core-0.5",
] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
tower-http = { version = "0.6", features = [
    "set-header",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "decompression-br",
    "decompression-gzip",
    "decompression-zstd",
    "validate-request",
] }
tower-sessions = { version = "0.14", default-features = false, features = [
    "axum-core",
    "signed",
] }
tower-sessions-redis-store = "0.16"
mini-moka = "0.10"
grass = { git = "https://github.com/connorskees/grass", rev = "refs/pull/103/head" }
mime = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "charset",
    "gzip",
    "json",
    "rustls-tls",
] }

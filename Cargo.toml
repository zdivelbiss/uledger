[package]
name = "µLedger"
version = "0.1.0"
edition = "2021"

[dependencies]
lib = { path = "src/_lib" }

dotenvy = "*"
thiserror = "*"

tokio = "*"
tracing = "*"
tracing-subscriber = "*"

figment = { version = "*", features = ["env"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde-big-array = "*"
argon2 = { version = "*", features = ["std", "simple"] }
rand = "*"
num_enum = "*"
base64 = "*"

chrono = { version = "*", features = ["serde"] }
uuid = { version = "*", features = ["serde", "v4", "v7"] }
sqlx = { version = "*", features = [
    "migrate",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "derive",
] }

rustls = { version = "*", default-features = false, features = [
    "ring",
    "logging",
] }

askama = { version = "*", features = ["with-axum"] }
askama_axum = "*"
axum = { version = "*", features = ["tracing", "macros"] }
axum-extra = { version = "*", features = ["cookie", "cookie-private"] }
tower-http = { version = "*", features = [
    "set-header",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "decompression-br",
    "decompression-gzip",
    "decompression-zstd",
    "validate-request",
] }
tower-sessions = { version = "*", default-features = false, features = [
    "axum-core",
    "signed",
] }
tower-sessions-redis-store = "*"
mini-moka = "*"
grass = { path = "../grass/crates/lib" }

reqwest = { version = "*", default-features = false, features = [
    "http2",
    "charset",
    "gzip",
    "json",
    "rustls-tls",
] }

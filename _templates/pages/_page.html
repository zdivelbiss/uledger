{{ extends "_base.html" }}

{{ block HEAD }}
<link rel="stylesheet" href="/assets/styles/page.scss" />
{{ endblock }}

{{ block BODY }}
<div class="flex-row w-100 h-100">
    <div id="sidebar" class="flex-col h-100">
        <header>
            Welcome<br />
            <strong hx-get="/api/v1/user/display_name" hx-trigger="load" hx-swap="textContent"></strong><br />
        </header>

        <nav class="flex-grow flex-col flex-axis-center">
            <a href="/accounts">Accounts</a>
            <a href="/payees">Payees</a>
            <a href="/transactions">Transactions</a>
        </nav>

        <button hx-post="/api/v1/user/logout" hx-trigger="click">Logout</button>
    </div>


    <div id="content" class="flex-grow flex-col">
        <main class="flex-grow flex-col">
            {{ block HEADER }}
            {{ endblock }}

            <hr />

            {{ block CONTENT }}
            {{ endblock }}
        </main>

        {{ include "_footer.html" }}
    </div>
</div>
{{ endblock }}

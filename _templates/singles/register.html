{{ extends "singles/_single.html" }}

{{ block TITLE }}
µLedger: Register
{{ endblock }}

{{ block CONTENT }}
<div class="flex-grow flex-col flex-axis-center flex-naxis-center w-dialog">
    <p id="form-status"></p>

    <form class="flex-col w-100" hx-post="/api/v1/user/register" hx-target-error="#form-status">
        <label for="display_name">What should we call you?</label>
        <input type="text" name="display_name" placeholder="your name..." maxlength="32" required />

        <label for="email_address">Your Email Address</label>
        <input type="text" name="email_address" placeholder="email address..." maxlength="128" required />

        <label for="password">Your Password</label>
        <input type="password" name="password" placeholder="password..." required />

        <input type="submit" value="Register" />
    </form>
</div>
{{ endblock }}
